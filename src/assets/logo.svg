<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="0.5" stop-color="#151517"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="18%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outerRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="pane" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d2d2d8"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="blur40" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur14" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur4" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dy="28"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="paneClip"><rect x="168" y="168" width="688" height="688" rx="190"/></clipPath>
    <mask id="innerShade">
      <rect x="168" y="168" width="688" height="688" rx="190" fill="white"/>
      <rect x="190" y="182" width="644" height="644" rx="172" fill="black" filter="url(#blur14)"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#light)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="url(#outerRim)" stroke-width="6"/>

  <ellipse cx="560" cy="420" rx="270" ry="200" fill="#ffffff" opacity="0.2" filter="url(#blur40)"/>

  <g filter="url(#shadow)">
    <rect x="168" y="168" width="688" height="688" rx="190" fill="#0b0b0d" fill-opacity="0.35"/>
  </g>
  <g clip-path="url(#paneClip)">
    <ellipse cx="530" cy="470" rx="340" ry="270" fill="#ffffff" opacity="0.17" filter="url(#blur40)"/>
    <rect x="168" y="168" width="688" height="688" fill="url(#pane)"/>
    <ellipse cx="512" cy="866" rx="320" ry="64" fill="#ffffff" opacity="0.24" filter="url(#blur14)"/>
    <path d="M 206 318 C 282 210 410 192 518 192 C 648 192 778 216 822 286 C 714 246 606 236 498 238 C 380 240 282 268 206 318 Z"
          fill="#ffffff" opacity="0.34" filter="url(#blur4)"/>
  </g>
  <rect x="168" y="168" width="688" height="688" rx="190" fill="#000" opacity="0.28" mask="url(#innerShade)"/>
  <rect x="169.5" y="169.5" width="685" height="685" rx="188.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 414 372 L 284 512 L 414 652" stroke="#000" stroke-opacity="0.38" stroke-width="62" transform="translate(0,12)" filter="url(#blur14)"/>
    <path d="M 610 372 L 740 512 L 610 652" stroke="#000" stroke-opacity="0.38" stroke-width="62" transform="translate(0,12)" filter="url(#blur14)"/>
    <path d="M 414 372 L 284 512 L 414 652" stroke="url(#glyph)" stroke-width="62"/>
    <path d="M 610 372 L 740 512 L 610 652" stroke="url(#glyph)" stroke-width="62"/>
    <path d="M 552 342 L 472 682" stroke="url(#slash)" stroke-width="42"/>
    <path d="M 544 360 L 535 396" stroke="#ffffff" stroke-opacity="0.9" stroke-width="10"/>
  </g>
</svg>
